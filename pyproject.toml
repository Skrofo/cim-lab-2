[project]
name = "cim-lab-2"
version = "0.1.0"
description = "Transfer learning and dataset dependence with Oxford-IIIT Pets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "hydra-core>=1.3,<2",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pillow>=10",
  "scikit-learn>=1.4",
  "torch>=2.4",
  "torchvision>=0.19",
  "wandb>=0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cim_lab_2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
